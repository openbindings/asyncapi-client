name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: asyncapi-client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: asyncapi-client
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
          package_json_file: asyncapi-client/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: asyncapi-client/pnpm-lock.yaml
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: asyncapi-client/go/go.mod
          cache-dependency-path: asyncapi-client/go/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Standalone build, type, unit, race and protocol checks
        run: pnpm verify
      - run: go vet ./...
        working-directory: asyncapi-client/go
        env:
          GOWORK: 'off'
      - name: Installed package consumers
        run: pnpm verify:consumers
      - name: Local MQTT broker tests
        run: node scripts/qualify-mqtt-go.mjs --standalone
      - name: Local Kafka broker tests
        run: node scripts/qualify-kafka.mjs --standalone
