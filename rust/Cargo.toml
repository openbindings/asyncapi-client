[workspace]
resolver = "3"
members = ["client", "wasm-bridge"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/openbindings/asyncapi-client"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "raw_value"] }
fluent-uri = "=0.4.1"
wasm-bindgen = "=0.2.129"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
